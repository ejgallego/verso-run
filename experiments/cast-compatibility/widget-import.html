<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Registered VIR shell import experiment</title>
<link rel="icon" href="data:,">
<script type="importmap">
{"imports": {
  "@leanprover/infoview": "./.lake/packages/lean_vir/node_modules/@leanprover/infoview/dist/index.production.min.js",
  "react": "./.lake/packages/lean_vir/node_modules/@leanprover/infoview/dist/react.production.min.js",
  "react/jsx-runtime": "./.lake/packages/lean_vir/node_modules/@leanprover/infoview/dist/react-jsx-runtime.production.min.js",
  "react-dom": "./.lake/packages/lean_vir/node_modules/@leanprover/infoview/dist/react-dom.production.min.js"
}}
</script>
<div id="probe"></div>
<script type="module">
import * as React from "react";
import * as ReactDOM from "react-dom";
import { importWidgetModule } from "@leanprover/infoview";

// The source reply is a controlled transport of the exact registered modules
// emitted by Lean. This does not exercise an editor connection or mount VIR.
window.probeResult = { done: false };
const check = (ok, message) => { if (!ok) throw new Error(message); };
const waitFor = async predicate => {
  const deadline = performance.now() + 5000;
  while (!predicate()) {
    check(performance.now() < deadline, "React probe timed out");
    await new Promise(resolve => requestAnimationFrame(resolve));
  }
};
let root;
try {
  const artifact = await (await fetch("widget-composition.json")).json();
  const source = new Map([
    [artifact.shellHash, artifact.shellSource],
    [artifact.wrapperHash, artifact.wrapperSource],
  ]);
  const calls = [];
  const pos = { uri: "file:///WidgetComposition.lean", line: 0, character: 0 };
  const session = {
    async call(method, params) {
      check(method === "Lean.Widget.getWidgetSource", `Unexpected RPC ${method}`);
      check(params.pos === pos, "Widget source lookup changed its supplied position");
      check(source.has(params.hash), "Unknown registered module hash");
      calls.push(params.hash);
      return { sourcetext: source.get(params.hash) };
    },
  };
  const wrapper = await importWidgetModule(session, pos, artifact.wrapperHash);
  const shell = await importWidgetModule(session, pos, artifact.shellHash);
  const again = await importWidgetModule(session, pos, artifact.wrapperHash);
  check(wrapper === again, "Registered wrapper module was not reused");
  check(calls.length === 2 && calls.includes(artifact.shellHash) &&
    calls.includes(artifact.wrapperHash), "Expected one lookup per registered module");

  const sentinel = {};
  const first = wrapper.default({ sentinel });
  const second = wrapper.default({ sentinel });
  check(React.isValidElement(first), "Wrapper did not return a React element");
  check(first.type === shell.default, "Wrapper copied or replaced the VIR shell");
  check(first.props.sentinel === sentinel, "Wrapper changed native prop identity");
  check(first.props.runComponent === second.props.runComponent,
    "Wrapper reconstructed the Run component factory");

  root = ReactDOM.createRoot(document.getElementById("probe"));
  root.render(React.createElement(first.props.runComponent));
  const button = () => document.querySelector("[data-run-probe]");
  await waitFor(() => button()?.textContent === "0");
  button().click();
  await waitFor(() => button()?.textContent === "1");
  root.render(React.createElement(second.props.runComponent));
  await new Promise(resolve => requestAnimationFrame(resolve));
  check(button()?.textContent === "1", "Native component state did not survive wrapper reuse");
  root.unmount(); root = null;
  check(!button(), "React probe did not unmount");
  window.probeResult = { done: true, ok: true, calls,
    shellHash: artifact.shellHash, wrapperHash: artifact.wrapperHash,
    checks: ["official hash-import loader", "registered shell identity",
      "native prop identity", "stable component factory", "shared React hooks/state", "unmount"] };
} catch (error) {
  root?.unmount();
  window.probeResult = { done: true, ok: false, error: String(error.stack ?? error) };
}
</script>
</html>
