name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Chromium
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Build
        run: lake build
      - name: Native and browser acceptance
        run: lake test -- --mutations --output _out/acceptance
      - name: Independent author starter
        run: uv run --with playwright python tests/starter.py --output _out/starter-acceptance
      - name: Package demo
        run: |
          lake exe lean-run-demo --with-html-single --with-tex --depth 2
          python3 scripts/package-demo.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: demo-and-acceptance
          path: _out/
          if-no-files-found: warn
      - name: Upload validated Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _out/html-multi

  pages:
    needs: acceptance
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --output "$RUNNER_TEMP/pages.json" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              python3 -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/pages.json")); assert p["build_type"] == "workflow", "Select GitHub Actions as the Pages source in repository settings"'
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Enable Pages with GitHub Actions at https://github.com/$GITHUB_REPOSITORY/settings/pages, then rerun this workflow."
              ;;
            *)
              echo "::error::Cannot read Pages settings (HTTP $status)"
              exit 1
              ;;
          esac
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy demo
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
